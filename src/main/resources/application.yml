server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: SeatReservation

  datasource:
    url: jdbc:mysql://localhost:3307/seat_reservation?useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
    username: root
    password: 622824
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual  # 启用手动 ACK 模式，防止消息丢失

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
jwt:
  secret: U2VhdFJlc2VydmF0aW9uU3lzdGVtQnlMRU9IRVJPMjAyNQ==
  expiration: 604800000

# 内部接口（/internal/**）服务间鉴权 token —— 供 Python Agent 调用，需与其 INTERNAL_API_TOKEN 一致
# 通过环境变量注入，禁止硬编码；未配置时内部接口一律拒绝（失败关闭）
internal:
  api:
    token: ${INTERNAL_API_TOKEN:Qk7mR2xV9pL4sN8wT1yB6cF3hJ5dG0aE7uZ2iO4pS9tW6xY1nM8bV3cX5zA0qD7f}