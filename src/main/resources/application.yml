server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: SeatReservation

  datasource:
    url: jdbc:mysql://localhost:3307/seat_reservation?useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
    username: root
    password: 622824
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual  # 启用手动 ACK 模式，防止消息丢失

  # Spring AI —— 阿里通义千问（DashScope）
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}   # 通过环境变量注入，禁止硬编码
      chat:
        options:
          model: qwen-plus                # 对话模型：qwen-turbo/qwen-plus/qwen-max
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3        # 向量模型（RAG 用）

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
jwt:
  secret: U2VhdFJlc2VydmF0aW9uU3lzdGVtQnlMRU9IRVJPMjAyNQ==
  expiration: 604800000