version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: seat-reservation-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 622824
      MYSQL_DATABASE: seat_reservation
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    networks:
      - seat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: seat-reservation-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - seat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # RabbitMQ 消息队列服务
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seat-reservation-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP 端口
      - "15672:15672" # 管理界面端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - seat-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      timeout: 10s
      retries: 5

  # Spring Boot 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seat-reservation-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 数据库配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/seat_reservation?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 622824
      # Redis 配置
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # RabbitMQ 配置
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      # 阿里通义千问 DashScope API Key 已迁移至 Python Agent 服务，Java 不再需要
      # 内部接口（/internal/**）服务间鉴权 token，需与 Python Agent 的 INTERNAL_API_TOKEN 一致
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # 时区设置
      TZ: Asia/Shanghai
    networks:
      - seat-network
    volumes:
      - app_logs:/app/logs

  # Python AI Agent 服务（FastAPI + LangChain/LangGraph + DashScope）
  # 负责 AI 对话编排/工具调用/RAG/记忆与历史，通过 /internal/** 调用 Java 业务底座
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: seat-reservation-ai-agent
    restart: always
    expose:
      - "8000"          # 仅内网暴露，对外统一经 nginx 反代
    depends_on:
      - app
    environment:
      # 通义千问（从宿主机环境变量透传）
      DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      CHAT_MODEL: qwen-plus
      EMBEDDING_MODEL: text-embedding-v3
      # 必须与 Java application.yml 的 jwt.secret 完全一致，用于校验用户 token
      JWT_SECRET: U2VhdFJlc2VydmF0aW9uU3lzdGVtQnlMRU9IRVJPMjAyNQ==
      # 必须与 Java internal.api.token 一致
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      JAVA_INTERNAL_BASE_URL: http://app:8080
      DB_PATH: db/reservation_agent.db
      TZ: Asia/Shanghai
    networks:
      - seat-network
    volumes:
      - ai_agent_db:/app/db   # 会话记忆 SQLite 持久化

  # Nginx：托管前端静态资源 + 反向代理 /api 到后端（对外唯一入口，端口 80）
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seat-reservation-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app
      - ai-agent
    networks:
      - seat-network

# 数据卷定义
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  app_logs:
    driver: local
  ai_agent_db:
    driver: local

# 网络定义
networks:
  seat-network:
    driver: bridge
